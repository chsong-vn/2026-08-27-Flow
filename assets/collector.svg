<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 60" fill="none" aria-label="Collector">
  <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">

    <!-- inlet / nozzle head -->
    <line x1="25" y1="0" x2="25" y2="8"/>
    <rect x="18" y="8" width="14" height="6" rx="1.5" fill="currentColor" opacity="0.12"/>
    <rect x="18" y="8" width="14" height="6" rx="1.5"/>

    <!-- manifold bar -->
    <rect x="8" y="16" width="34" height="6" rx="2" fill="currentColor" opacity="0.10"/>
    <rect x="8" y="16" width="34" height="6" rx="2"/>

    <!-- vials (simple repeated cylinders) -->
    <g>
      <rect x="8"  y="24" width="4.5" height="14" rx="1.4"/>
      <rect x="14" y="24" width="4.5" height="14" rx="1.4"/>
      <rect x="20" y="24" width="4.5" height="14" rx="1.4"/>
      <rect x="26" y="24" width="4.5" height="14" rx="1.4"/>
      <rect x="32" y="24" width="4.5" height="14" rx="1.4"/>
      <rect x="38" y="24" width="4.5" height="14" rx="1.4"/>
    </g>

    <!-- base tray -->
    <rect x="6" y="40" width="38" height="8" rx="2" fill="currentColor" opacity="0.10"/>
    <rect x="6" y="40" width="38" height="8" rx="2"/>

  </g>
</svg>

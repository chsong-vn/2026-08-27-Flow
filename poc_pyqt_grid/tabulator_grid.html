<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="vendor/tab_tabulator.min.css">
  <script src="vendor/tab_tabulator.min.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    :root {
      --brand: #e8743b; --brand-weak: #fdf1ea;
      --tx: #1f2430; --tx2: #6b7280; --tx3: #9aa1ac;
      --line: #eef0f3; --band: #f8f9fb;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f3f4f6; color: var(--tx); -webkit-font-smoothing: antialiased; }
    .page { padding: 22px; height: 100%; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 18px 20px 10px; height: 100%; display: flex; flex-direction: column;
      box-shadow: 0 1px 2px rgba(16,24,40,.04); }
    .hd { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 16px; }
    .title { font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; }
    .title .sub { color: var(--tx3); font-weight: 450; font-size: 12.5px; margin-left: 10px; }
    .chip { background: var(--band); color: var(--tx2); border: 1px solid var(--line);
      border-radius: 8px; padding: 4px 10px; font-size: 11.5px; font-weight: 500; }
    #grid { flex: 1; }

    /* ── Tabulator → 현재 디자인 시스템에 맞춤 ── */
    .tabulator { border: none; background: transparent; font-size: 13.5px; }
    .tabulator .tabulator-header { border: none; border-bottom: 1px solid var(--line);
      background: #fff; color: #8a929e; }
    .tabulator .tabulator-header .tabulator-col { background: #fff; border: none; }
    .tabulator .tabulator-col-title { color: #8a929e; font-weight: 600; font-size: 11.5px;
      letter-spacing: .02em; }
    .tabulator .tabulator-row { border-bottom: 1px solid #f3f4f6; background: #fff; }
    .tabulator .tabulator-row.tabulator-row-even { background: #fff; }
    .tabulator .tabulator-row:hover { background: #fcfbfa; }
    .tabulator .tabulator-cell { border: none; padding: 12px 16px; color: var(--tx);
      vertical-align: middle; }
    .tabulator .tabulator-cell.tabulator-editing { border: 1px solid var(--brand) !important;
      padding: 11px 15px; }

    /* 셀 위계 */
    .c-muted { color: var(--tx3); }
    .c-inp { background: #fdfcfb; }
    .c-res { color: var(--brand); font-weight: 600; }
    .c-smiles { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; color: #9aa1ac; }

    /* ── 그룹(펌프) 밴드 — 아이콘/점 없이 절제 ── */
    .tabulator .tabulator-group { background: var(--band); border: none;
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      padding: 0; }
    .tabulator .tabulator-group.tabulator-group-visible .tabulator-arrow,
    .tabulator .tabulator-group .tabulator-arrow { display: none; }
    .grp-band { display: flex; align-items: center; height: 36px; padding: 0 16px; }
    .grp-name { font-weight: 600; font-size: 11.5px; color: #667085; letter-spacing: .06em; }
    .grp-ports { margin-left: auto; font-size: 11px; color: var(--tx3); font-weight: 500; }

    /* 범위 선택(엑셀형) 하이라이트 → 브랜드 */
    .tabulator .tabulator-cell.tabulator-range-selected { background: var(--brand-weak) !important; }
    .tabulator .tabulator-range-overlay .tabulator-range { border: 1.5px solid var(--brand); }
    .tabulator .tabulator-range-overlay .tabulator-range.tabulator-range-active { border-color: var(--brand); }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="hd">
        <div class="title">시약 · 스톡 계산<span class="sub">MW + 2개 입력 → 자동 계산  ·  엑셀 복붙/드래그 선택</span></div>
        <div class="chip">Tabulator · PyQt embed</div>
      </div>
      <div id="grid"></div>
    </div>
  </div>
  <script>
    const num = (v) => { const f = parseFloat(String(v).replace(',', '.')); return isFinite(f) ? f : 0; };
    const rnd = (v, d = 4) => Math.round(v * 10 ** d) / 10 ** d;
    const GCOLOR = { A: "#e8743b", B: "#2f80ed", C: "#27ae60", D: "#8b5cf6" };

    function recalc(d) {
      const MW = num(d.mw), V = num(d.vol), M = num(d.mass), C = num(d.conc);
      if (MW > 0) {
        if (V > 0 && C > 0) d.mass = rnd(C * (V / 1000) * MW);
        else if (M > 0 && C > 0) d.vol = rnd((M / MW) / C * 1000);
        else if (M > 0 && V > 0) d.conc = rnd((M / MW) / (V / 1000));
      }
      const p = [];
      if (num(d.mass)) p.push(`질량 ${rnd(d.mass, 3)} g`);
      if (num(d.vol)) p.push(`부피 ${rnd(d.vol, 3)} mL`);
      if (num(d.conc)) p.push(`농도 ${rnd(d.conc, 3)} M`);
      d.result = p.join('   ');
    }

    const COLUMNS = [
      { title: "포트", field: "port", width: 66, cssClass: "c-muted" },
      { title: "CAS", field: "cas", width: 150, editor: "input" },
      { title: "MW (g/mol)", field: "mw", width: 104, hozAlign: "right", editor: "number" },
      { title: "SMILES", field: "smiles", width: 200, editor: "input", cssClass: "c-smiles" },
      { title: "시약명", field: "name", width: 178, editor: "input" },
      { title: "밀도 (g/mL)", field: "density", width: 98, hozAlign: "right", editor: "number" },
      { title: "부피 (mL)", field: "vol", width: 88, hozAlign: "right", editor: "number", cssClass: "c-inp" },
      { title: "질량 (g)", field: "mass", width: 88, hozAlign: "right", editor: "number", cssClass: "c-inp" },
      { title: "농도 (M)", field: "conc", width: 88, hozAlign: "right", editor: "number", cssClass: "c-inp" },
      { title: "계산 결과", field: "result", widthGrow: 1, minWidth: 160, cssClass: "c-res" },
    ];

    let table = null, gridBridge = null;

    new QWebChannel(qt.webChannelTransport, function (channel) {
      const bridge = channel.objects.bridge;
      gridBridge = bridge;
      bridge.configReady.connect(function (colsJson, rowsJson) {
        const rows = JSON.parse(rowsJson);
        rows.forEach(recalc);
        table = new Tabulator("#grid", {
          data: rows,
          layout: "fitColumns",
          columns: COLUMNS,
          index: "_id",
          groupBy: "grp",
          groupStartOpen: true,
          groupHeader: function (value, count, data, group) {
            const c = GCOLOR[value] || "#e8743b";
            return `<div class="grp-band" style="box-shadow:inset 3px 0 0 ${c}">` +
              `<span class="grp-name">GROUP ${value}</span>` +
              `<span class="grp-ports">Ports 2–11</span></div>`;
          },
          // ── 엑셀형 복붙 + 범위선택 (Tabulator 내장) ──
          clipboard: true,
          clipboardCopyStyled: false,
          clipboardPasteAction: "range",
          selectableRange: true,
          selectableRangeColumns: true,
          selectableRangeRows: true,
          editTriggerEvent: "dblclick",
          rowHeight: 44,
        });

        table.on("cellEdited", function (cell) {
          const row = cell.getRow(), d = row.getData();
          recalc(d); row.update(d);
          gridBridge && gridBridge.onCell(JSON.stringify(d));
        });
        table.on("clipboardPasted", function () {
          table.getRows().forEach(r => { const d = r.getData(); recalc(d); r.update(d); });
          gridBridge && gridBridge.onCell(JSON.stringify({ _bulk: true }));
        });
      });
      bridge.onReady();
    });
  </script>
</body>
</html>

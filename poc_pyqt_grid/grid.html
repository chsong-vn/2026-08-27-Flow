<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="vendor/ag-grid.css">
  <link rel="stylesheet" href="vendor/ag-theme-quartz.css">
  <script src="vendor/ag-grid-community.min.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    :root {
      --brand: #e8743b; --brand-weak: #fdf1ea;
      --tx: #1f2430; --tx2: #6b7280; --tx3: #9aa1ac;
      --line: #eef0f3; --band: #f8f9fb;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f3f4f6; color: var(--tx);
      -webkit-font-smoothing: antialiased; }
    .page { padding: 22px; height: 100%; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 18px 20px 8px; height: 100%; display: flex; flex-direction: column;
      box-shadow: 0 1px 2px rgba(16,24,40,.04); }
    .hd { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 16px; }
    .title { font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; }
    .title .sub { color: var(--tx3); font-weight: 450; font-size: 12.5px; margin-left: 10px; }
    .chip { background: var(--band); color: var(--tx2); border: 1px solid var(--line);
      border-radius: 8px; padding: 4px 10px; font-size: 11.5px; font-weight: 500; }
    #grid { flex: 1; }

    /* ── AG Grid Quartz — 차분한 디자인 시스템 ── */
    .ag-theme-quartz {
      --ag-font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      --ag-font-size: 13.5px;
      --ag-row-height: 44px; --ag-header-height: 44px;
      --ag-cell-horizontal-padding: 16px;
      --ag-header-background-color: #ffffff;
      --ag-header-foreground-color: #8a929e;
      --ag-foreground-color: var(--tx);
      --ag-row-hover-color: #fcfbfa;
      --ag-selected-row-background-color: var(--brand-weak);
      --ag-range-selection-background-color: var(--brand-weak);
      --ag-accent-color: var(--brand);
      --ag-border-color: var(--line);
      --ag-row-border-color: #f3f4f6;
      --ag-borders: none;
      --ag-wrapper-border-radius: 12px;
      --ag-input-focus-border-color: var(--brand);
    }
    .ag-header-cell-text { font-weight: 600; font-size: 11.5px; letter-spacing: .02em;
      white-space: pre-line; line-height: 1.2; }
    .ag-cell { display: flex; align-items: center; }

    /* 입력 vs 계산 셀 구분 (은은하게) */
    .cell-inp { background: #fdfcfb; }
    .cell-res { color: var(--brand); font-weight: 600; }
    .cell-muted { color: var(--tx3); }
    .cell-smiles { font-family: Consolas, "Courier New", monospace; font-size: 11.5px;
      color: #9aa1ac; letter-spacing: -.01em; }

    /* ── 그룹(펌프) 섹션 밴드 — 아이콘/구분점 없이 절제 ── */
    .grp { height: 100%; display: flex; align-items: center; padding: 0 16px;
      background: var(--band); border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line); }
    .grp .name { font-weight: 600; font-size: 11.5px; color: #667085;
      letter-spacing: .06em; text-transform: uppercase; }
    .grp .spacer { flex: 1; }
    .grp .ports { font-size: 11px; color: var(--tx3); font-weight: 500; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="hd">
        <div class="title">시약 · 스톡 계산<span class="sub">MW + 2개 입력 → 나머지 자동 계산</span></div>
        <div class="chip">AG Grid · PyQt embed</div>
      </div>
      <div id="grid" class="ag-theme-quartz"></div>
    </div>
  </div>
  <script>
    const num = (v) => { const f = parseFloat(v); return isFinite(f) ? f : 0; };
    const rnd = (v, d = 4) => Math.round(v * 10 ** d) / 10 ** d;

    function recalc(d) {
      const MW = num(d.mw), V = num(d.vol), M = num(d.mass), C = num(d.conc);
      if (MW > 0) {
        if (V > 0 && C > 0) d.mass = rnd(C * (V / 1000) * MW);
        else if (M > 0 && C > 0) d.vol = rnd((M / MW) / C * 1000);
        else if (M > 0 && V > 0) d.conc = rnd((M / MW) / (V / 1000));
      }
      const p = [];
      if (num(d.mass)) p.push(`질량 ${rnd(d.mass, 3)} g`);
      if (num(d.vol)) p.push(`부피 ${rnd(d.vol, 3)} mL`);
      if (num(d.conc)) p.push(`농도 ${rnd(d.conc, 3)} M`);
      d.result = p.join('  ');   // em-space 구분 (점 없이)
    }

    let api = null, gridBridge = null;
    const TEXT_FIELDS = new Set(['cas', 'smiles', 'name']);
    const SKIP_FIELDS = new Set(['port', 'result']);
    const isDataRow = (n) => n && n.data && !n.data._grp;
    function coerce(field, v) {
      if (v === '' || v == null) return null;
      if (TEXT_FIELDS.has(field)) return String(v);
      const f = parseFloat(String(v).replace(',', '.'));
      return isFinite(f) ? f : String(v);
    }

    // ── Excel 붙여넣기 (Ctrl+V): 포커스 셀 → 오른쪽·아래 채움 (기존 계산기 동일) ──
    document.addEventListener('paste', function (ev) {
      if (!api) return;
      const cell = api.getFocusedCell();
      if (!cell) return;
      const text = (ev.clipboardData || window.clipboardData).getData('text');
      if (!text || (!text.includes('\t') && !text.includes('\n'))) return;  // 단일값은 기본 편집
      ev.preventDefault();
      const matrix = text.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(r => r.split('\t'));
      const colIds = api.getColumns().map(c => c.getColId());
      const startCol = colIds.indexOf(cell.column.getColId());
      let ri = cell.rowIndex, mi = 0; const touched = [];
      while (mi < matrix.length) {
        const node = api.getDisplayedRowAtIndex(ri);
        if (!node) break;
        if (!isDataRow(node)) { ri++; continue; }          // 그룹 구분행 스킵
        matrix[mi].forEach((val, ci) => {
          const field = colIds[startCol + ci];
          if (!field || SKIP_FIELDS.has(field)) return;
          node.setDataValue(field, coerce(field, val));
        });
        recalc(node.data);
        node.setDataValue('result', node.data.result);
        touched.push(node.data); ri++; mi++;
      }
      api.refreshCells({ force: true });
      touched.forEach(d => gridBridge && gridBridge.onCell(JSON.stringify(d)));
    });

    // ── Ctrl+C 복사(포커스 셀) / Delete 지우기 ──
    document.addEventListener('keydown', function (ev) {
      if (!api) return;
      const cell = api.getFocusedCell();
      if (!cell) return;
      const node = api.getDisplayedRowAtIndex(cell.rowIndex);
      if (!isDataRow(node)) return;
      const field = cell.column.getColId();
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'c') {
        const v = node.data[field];
        if (navigator.clipboard) navigator.clipboard.writeText(v == null ? '' : String(v));
      } else if ((ev.key === 'Delete' || ev.key === 'Backspace') && !SKIP_FIELDS.has(field)) {
        node.setDataValue(field, null);
        recalc(node.data); node.setDataValue('result', node.data.result);
        gridBridge && gridBridge.onCell(JSON.stringify(node.data));
      }
    });

    new QWebChannel(qt.webChannelTransport, function (channel) {
      const bridge = channel.objects.bridge;
      gridBridge = bridge;
      bridge.configReady.connect(function (colsJson, rowsJson) {
        const rows = JSON.parse(rowsJson);
        rows.forEach(r => { if (!r._grp) recalc(r); });
        const options = {
          columnDefs: JSON.parse(colsJson),
          rowData: rows,
          defaultColDef: { sortable: false, resizable: true, editable: true, minWidth: 64 },
          headerHeight: 44, animateRows: true,
          getRowHeight: (p) => (p.data && p.data._grp) ? 36 : 44,
          isFullWidthRow: (p) => !!(p.rowNode.data && p.rowNode.data._grp),
          fullWidthCellRenderer: (p) => {
            const d = p.data;
            const e = document.createElement('div');
            e.className = 'grp';
            e.style.boxShadow = `inset 3px 0 0 ${d._color || '#e8743b'}`;
            e.innerHTML =
              `<span class="name">Group ${d._grp}</span>` +
              `<span class="spacer"></span>` +
              (d._ports ? `<span class="ports">${d._ports}</span>` : '');
            return e;
          },
          onCellValueChanged: function (e) {
            recalc(e.data);
            e.api.applyTransaction({ update: [e.data] });
            bridge.onCell(JSON.stringify(e.data));
          },
        };
        const div = document.querySelector('#grid');
        div.innerHTML = '';
        api = agGrid.createGrid(div, options);
      });
      bridge.onReady();
    });
  </script>
</body>
</html>
